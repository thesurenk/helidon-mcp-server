# E2B.dev deployment configuration for Helidon MCP Server
name: helidon-mcp-server
description: "Model Context Protocol (MCP) server implementation using Java and Helidon framework"

# Runtime configuration
runtime:
  image: surendocker/helidon-mcp-server:latest
  ports:
    - 8080:8080
  environment:
    - JAVA_OPTS=-Xmx512m -Xms256m
    - SERVER_PORT=8080
  resources:
    memory: 512Mi
    cpu: 0.5

# Health check configuration
healthcheck:
  path: /
  port: 8080
  interval: 30s
  timeout: 10s
  retries: 3

# Scaling configuration
scaling:
  min_replicas: 1
  max_replicas: 3
  target_cpu: 70

# Networking
network:
  type: public
  domain: helidon-mcp-server.e2b.dev

# Environment variables
env:
  - name: JAVA_OPTS
    value: "-Xmx512m -Xms256m"
  - name: SERVER_PORT
    value: "8080"
  - name: LOG_LEVEL
    value: "INFO"

# Persistent storage (if needed)
storage:
  enabled: false

# Monitoring
monitoring:
  enabled: true
  metrics:
    - cpu
    - memory
    - requests
