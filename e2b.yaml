# E2B.dev sandbox configuration for Helidon MCP Server
# This file contains environment variables and configuration for E2B sandbox
name: helidon-mcp-server
description: "Model Context Protocol (MCP) server implementation using Java and Helidon framework"

# Environment variables for E2B sandbox
env:
  - name: JAVA_OPTS
    value: "-Xmx512m -Xms256m"
  - name: SERVER_PORT
    value: "8080"
  - name: LOG_LEVEL
    value: "INFO"
  - name: E2B_SANDBOX_TIMEOUT
    value: "300"  # 5 minutes default

# Sandbox configuration
sandbox:
  timeout: 300  # 5 minutes
  memory: 512Mi
  cpu: 0.5
  ports:
    - 8080:8080
